services:
  postgres:
    image: postgres:16-alpine
    container_name: bredgepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bredgepulse
      POSTGRES_USER: bredgepulse
      POSTGRES_PASSWORD: bredgepulse
    ports:
      - "5432:5432"
    volumes:
      - bredgepulse_pgdata:/var/lib/postgresql/data
volumes:
  bredgepulse_pgdata:
